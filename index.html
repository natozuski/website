<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="content/icon.ico">
    <link rel="apple-touch-icon" href="content/icon.ico">
    <title>The History Books – 3D House & University</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 14px;
            pointer-events: none;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 100;
        }
        #info i {
            font-style: normal;
            display: inline-block;
            margin-right: 8px;
            opacity: 0.8;
        }
        #tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
            z-index: 200;
            white-space: nowrap;
            transform: translate(-50%, -130%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #tooltip.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="info">
        <i>🏠</i> Drag to pan • Scroll to zoom • Click the buildings & outhouse
    </div>
    <div id="tooltip"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.126.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.126.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Setup Scene, Camera, Renderer ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xaaccff);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 9, 22);
        camera.lookAt(0, 2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- Controls ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 2, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = true;
        controls.enableZoom = true;
        controls.zoomSpeed = 1.2;
        controls.panSpeed = 0.8;
        controls.maxPolarAngle = Math.PI / 2.2;
        controls.minDistance = 5;
        controls.maxDistance = 60;
        controls.update();

        // --- Lighting ---
        scene.add(new THREE.AmbientLight(0x404060, 1.2));

        const dirLight = new THREE.DirectionalLight(0xfff5e6, 1.5);
        dirLight.position.set(15, 25, 10);
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0xccddff, 0.8);
        fillLight.position.set(-10, 8, 12);
        scene.add(fillLight);

        const backLight = new THREE.DirectionalLight(0xffffff, 0.5);
        backLight.position.set(0, 8, -20);
        scene.add(backLight);

        // --- INTERACTIVE OBJECTS ARRAY ---
        const interactiveObjects = [];

        function makeInteractive(mesh, url, label) {
            mesh.userData = { url, label };
            interactiveObjects.push(mesh);
            return mesh;
        }

        // ============================================================
        //  HOUSE  (left side) — TWO ROOMS
        // ============================================================
        const houseGroup = new THREE.Group();
        houseGroup.position.set(-4.5, 0, 0);
        scene.add(houseGroup);

        const wallColor = 0xf0e6d2;
        const interiorWallColor = 0xe0d5c0;
        const roofColor = 0xb54b3d;
        const doorColorA = 0x8b5a2b;
        const doorColorB = 0x6b4a2b;
        const windowColor = 0xaad4f5;
        const windowFrameColor = 0x6b4f3c;
        const chimneyColor = 0x9e6b5e;

        const roomWidth = 2.0;
        const roomHeight = 2.2;
        const roomDepth = 4;
        const wallThickness = 0.08;
        const totalWidth = roomWidth * 2 + wallThickness;

        // Left outer wall
        const leftWall = makeInteractive(
            new THREE.Mesh(
                new THREE.BoxGeometry(wallThickness, roomHeight, roomDepth),
                new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.7 })
            ),
            'https://en.wikipedia.org/wiki/House',
            '🏠 West Wall'
        );
        leftWall.position.set(-roomWidth - wallThickness / 2, roomHeight / 2, 0);
        houseGroup.add(leftWall);

        // Right outer wall
        const rightWall = makeInteractive(
            new THREE.Mesh(
                new THREE.BoxGeometry(wallThickness, roomHeight, roomDepth),
                new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.7 })
            ),
            'https://en.wikipedia.org/wiki/House',
            '🏠 East Wall'
        );
        rightWall.position.set(roomWidth + wallThickness / 2, roomHeight / 2, 0);
        houseGroup.add(rightWall);

        // Back wall
        const backWall = makeInteractive(
            new THREE.Mesh(
                new THREE.BoxGeometry(totalWidth, roomHeight, wallThickness),
                new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.7 })
            ),
            'https://en.wikipedia.org/wiki/House',
            '🏠 Back Wall'
        );
        backWall.position.set(0, roomHeight / 2, -roomDepth / 2 - wallThickness / 2);
        houseGroup.add(backWall);

        // Front walls with door gaps
        const doorWidth = 0.8;
        const doorHeight = 1.4;
        const frontZ = roomDepth / 2 + wallThickness / 2;

        function buildFrontWallSegment(xCenter, width, yCenter, height, label) {
            const seg = makeInteractive(
                new THREE.Mesh(
                    new THREE.BoxGeometry(width, height, wallThickness),
                    new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.7 })
                ),
                'https://en.wikipedia.org/wiki/House',
                label
            );
            seg.position.set(xCenter, yCenter, frontZ);
            houseGroup.add(seg);
            return seg;
        }

        const roomACenterX = -roomWidth / 2;
        const roomBCenterX = roomWidth / 2;
        const sideWidthA = (roomWidth - doorWidth) / 2;

        buildFrontWallSegment(roomACenterX - doorWidth / 2 - sideWidthA / 2, sideWidthA, roomHeight / 2, roomHeight, '🏠 Room A Front (Left)');
        buildFrontWallSegment(roomACenterX + doorWidth / 2 + sideWidthA / 2, sideWidthA, roomHeight / 2, roomHeight, '🏠 Room A Front (Right)');
        buildFrontWallSegment(roomACenterX, doorWidth, doorHeight + (roomHeight - doorHeight) / 2, roomHeight - doorHeight, '🏠 Room A Lintel');

        buildFrontWallSegment(roomBCenterX - doorWidth / 2 - sideWidthA / 2, sideWidthA, roomHeight / 2, roomHeight, '🏠 Room B Front (Left)');
        buildFrontWallSegment(roomBCenterX + doorWidth / 2 + sideWidthA / 2, sideWidthA, roomHeight / 2, roomHeight, '🏠 Room B Front (Right)');
        buildFrontWallSegment(roomBCenterX, doorWidth, doorHeight + (roomHeight - doorHeight) / 2, roomHeight - doorHeight, '🏠 Room B Lintel');

        // Interior divider
        const interiorDoorWidth = 0.7;
        const interiorDoorHeight = 1.5;

        const dividerFront = makeInteractive(
            new THREE.Mesh(
                new THREE.BoxGeometry(wallThickness, roomHeight, (roomDepth - interiorDoorWidth) / 2),
                new THREE.MeshStandardMaterial({ color: interiorWallColor, roughness: 0.7 })
            ),
            'https://en.wikipedia.org/wiki/Wall',
            '🧱 Interior Divider (Front)'
        );
        dividerFront.position.set(0, roomHeight / 2, (roomDepth / 2) - (roomDepth - interiorDoorWidth) / 4);
        houseGroup.add(dividerFront);

        const dividerBack = makeInteractive(
            new THREE.Mesh(
                new THREE.BoxGeometry(wallThickness, roomHeight, (roomDepth - interiorDoorWidth) / 2),
                new THREE.MeshStandardMaterial({ color: interiorWallColor, roughness: 0.7 })
            ),
            'https://en.wikipedia.org/wiki/Wall',
            '🧱 Interior Divider (Back)'
        );
        dividerBack.position.set(0, roomHeight / 2, -(roomDepth / 2) + (roomDepth - interiorDoorWidth) / 4);
        houseGroup.add(dividerBack);

        const dividerLintel = makeInteractive(
            new THREE.Mesh(
                new THREE.BoxGeometry(wallThickness, roomHeight - interiorDoorHeight, interiorDoorWidth),
                new THREE.MeshStandardMaterial({ color: interiorWallColor, roughness: 0.7 })
            ),
            'https://en.wikipedia.org/wiki/Wall',
            '🧱 Interior Lintel'
        );
        dividerLintel.position.set(0, interiorDoorHeight + (roomHeight - interiorDoorHeight) / 2, 0);
        houseGroup.add(dividerLintel);

        // Doors
        const doorDepth = 0.12;

        const doorA = makeInteractive(
            new THREE.Mesh(
                new THREE.BoxGeometry(doorWidth, doorHeight, doorDepth),
                new THREE.MeshStandardMaterial({ color: doorColorA, roughness: 0.8 })
            ),
            'legacy.html',
            '🚪 My Door'
        );
        doorA.position.set(roomACenterX, doorHeight / 2, frontZ + doorDepth / 2 - 0.02);
        houseGroup.add(doorA);

        const handleA = makeInteractive(
            new THREE.Mesh(
                new THREE.SphereGeometry(0.06, 8, 8),
                new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0x331100 })
            ),
            'https://en.wikipedia.org/wiki/Door_handle',
            '🔑 Room A Handle'
        );
        handleA.position.set(roomACenterX + 0.28, doorHeight / 2, frontZ + doorDepth + 0.02);
        houseGroup.add(handleA);

        const doorB = makeInteractive(
            new THREE.Mesh(
                new THREE.BoxGeometry(doorWidth, doorHeight, doorDepth),
                new THREE.MeshStandardMaterial({ color: doorColorB, roughness: 0.8 })
            ),
            'https://chat.deepseek.com',
            '🚪 Room B Door'
        );
        doorB.position.set(roomBCenterX, doorHeight / 2, frontZ + doorDepth / 2 - 0.02);
        houseGroup.add(doorB);

        const handleB = makeInteractive(
            new THREE.Mesh(
                new THREE.SphereGeometry(0.06, 8, 8),
                new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0x331100 })
            ),
            'https://en.wikipedia.org/wiki/Door_handle',
            '🔑 Room B Handle'
        );
        handleB.position.set(roomBCenterX + 0.28, doorHeight / 2, frontZ + doorDepth + 0.02);
        houseGroup.add(handleB);

        // Roof
        const roofHeight = 1.7;
        const roofRadius = Math.sqrt(2) * (totalWidth / 2) * 1.02;
        const roof = makeInteractive(
            new THREE.Mesh(
                new THREE.ConeGeometry(roofRadius, roofHeight, 4),
                new THREE.MeshStandardMaterial({ color: roofColor, roughness: 0.5, flatShading: true })
            ),
            'https://en.wikipedia.org/wiki/Roof',
            '🏘️ Roof'
        );
        roof.position.y = roomHeight + roofHeight / 2;
        roof.rotation.y = Math.PI / 4;
        houseGroup.add(roof);

        // Windows
        function createHouseWindow(posX, posY, posZ, rotationY = 0, label) {
            const windowGroup = new THREE.Group();
            const w = 0.6, h = 0.6, d = 0.1;

            const glass = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, d),
                new THREE.MeshStandardMaterial({ color: windowColor, emissive: 0x112233, transparent: true, opacity: 0.8 })
            );
            makeInteractive(glass, 'https://en.wikipedia.org/wiki/Window', label);
            windowGroup.add(glass);

            const barMat = new THREE.MeshStandardMaterial({ color: windowFrameColor });
            const hBar = new THREE.Mesh(new THREE.BoxGeometry(w + 0.06, 0.05, d + 0.02), barMat);
            hBar.position.z = 0.01;
            makeInteractive(hBar, 'https://en.wikipedia.org/wiki/Window', label);
            windowGroup.add(hBar);

            const vBar = new THREE.Mesh(new THREE.BoxGeometry(0.05, h + 0.06, d + 0.02), barMat);
            vBar.position.z = 0.01;
            makeInteractive(vBar, 'https://en.wikipedia.org/wiki/Window', label);
            windowGroup.add(vBar);

            windowGroup.position.set(posX, posY, posZ);
            windowGroup.rotation.y = rotationY;
            return windowGroup;
        }

        houseGroup.add(createHouseWindow(-roomWidth - wallThickness / 2 - 0.02, 1.5, 0, Math.PI / 2, '🪟 Room A Side Window'));
        houseGroup.add(createHouseWindow(roomWidth + wallThickness / 2 + 0.02, 1.5, 0, -Math.PI / 2, '🪟 Room B Side Window'));
        houseGroup.add(createHouseWindow(roomACenterX, 1.9, frontZ + 0.06, 0, '🪟 Room A Upper Window'));
        houseGroup.add(createHouseWindow(roomBCenterX, 1.9, frontZ + 0.06, 0, '🪟 Room B Upper Window'));

        // Chimney
        const chimney = makeInteractive(
            new THREE.Mesh(
                new THREE.BoxGeometry(0.5, 1.0, 0.5),
                new THREE.MeshStandardMaterial({ color: chimneyColor, roughness: 0.9 })
            ),
            'https://en.wikipedia.org/wiki/Chimney',
            '💨 Chimney'
        );
        chimney.position.set(1.2, roomHeight + roofHeight - 0.3, -1.2);
        houseGroup.add(chimney);

        const chimneyTop = makeInteractive(
            new THREE.Mesh(
                new THREE.BoxGeometry(0.6, 0.08, 0.6),
                new THREE.MeshStandardMaterial({ color: 0x7a5a4a })
            ),
            'https://en.wikipedia.org/wiki/Chimney',
            '💨 Chimney Top'
        );
        chimneyTop.position.set(1.2, roomHeight + roofHeight + 0.2, -1.2);
        houseGroup.add(chimneyTop);

        // ============================================================
        //  UNIVERSITY BUILDING  (right side)
        // ============================================================
        const uniGroup = new THREE.Group();
        uniGroup.position.set(5, 0, 0);
        scene.add(uniGroup);

        const uniWallColor = 0xd8c8b0;
        const uniRoofColor = 0x4a6b8a;
        const uniDoorColor = 0x3a2a1a;
        const uniWindowColor = 0x9ec4e0;
        const uniWindowFrameColor = 0x3a4a5a;
        const uniColumnColor = 0xe8dcc8;

        const uniWallWidth = 5;
        const uniWallHeight = 3.6;
        const uniWallDepth = 4;

        const uniWalls = makeInteractive(
            new THREE.Mesh(
                new THREE.BoxGeometry(uniWallWidth, uniWallHeight, uniWallDepth),
                new THREE.MeshStandardMaterial({ color: uniWallColor, roughness: 0.75 })
            ),
            'https://en.wikipedia.org/wiki/University',
            '🎓 The University'
        );
        uniWalls.position.y = uniWallHeight / 2;
        uniGroup.add(uniWalls);

        const uniRoof = makeInteractive(
            new THREE.Mesh(
                new THREE.ConeGeometry(Math.sqrt(2) * (uniWallWidth / 2) * 1.08, 1.0, 4),
                new THREE.MeshStandardMaterial({ color: uniRoofColor, roughness: 0.6, flatShading: true })
            ),
            'https://en.wikipedia.org/wiki/University',
            '🎓 University Roof'
        );
        uniRoof.position.y = uniWallHeight + 0.5;
        uniRoof.rotation.y = Math.PI / 4;
        uniGroup.add(uniRoof);

        const columnGeo = new THREE.CylinderGeometry(0.15, 0.15, uniWallHeight, 10);
        const columnMat = new THREE.MeshStandardMaterial({ color: uniColumnColor, roughness: 0.6 });
        [-1.6, -0.55, 0.55, 1.6].forEach((x) => {
            const col = makeInteractive(
                new THREE.Mesh(columnGeo, columnMat),
                'https://en.wikipedia.org/wiki/Column',
                '🏛️ Column'
            );
            col.position.set(x, uniWallHeight / 2, uniWallDepth / 2 + 0.2);
            uniGroup.add(col);
        });

        const pediment = makeInteractive(
            new THREE.Mesh(
                new THREE.BoxGeometry(3.6, 0.5, 0.4),
                new THREE.MeshStandardMaterial({ color: uniColumnColor, roughness: 0.6 })
            ),
            'https://en.wikipedia.org/wiki/Pediment',
            '🏛️ Pediment'
        );
        pediment.position.set(0, uniWallHeight - 0.25, uniWallDepth / 2 + 0.2);
        uniGroup.add(pediment);

        const uniDoor = makeInteractive(
            new THREE.Mesh(
                new THREE.BoxGeometry(1.2, 1.8, 0.15),
                new THREE.MeshStandardMaterial({ color: uniDoorColor, roughness: 0.7 })
            ),
            'https://uni.nathanielozuski.com',
            '🚪 Main Entrance'
        );
        uniDoor.position.set(0, 0.9, uniWallDepth / 2 + 0.08);
        uniGroup.add(uniDoor);

        const uniHandle = makeInteractive(
            new THREE.Mesh(
                new THREE.SphereGeometry(0.07, 8, 8),
                new THREE.MeshStandardMaterial({ color: 0xffcc44, emissive: 0x332200 })
            ),
            'https://en.wikipedia.org/wiki/Door_handle',
            '🔑 Handle'
        );
        uniHandle.position.set(0.4, 0.95, uniWallDepth / 2 + 0.2);
        uniGroup.add(uniHandle);

        function createUniWindow(posX, posY, posZ, rotationY = 0) {
            const windowGroup = new THREE.Group();
            const w = 0.7, h = 0.7, d = 0.08;

            const glass = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, d),
                new THREE.MeshStandardMaterial({ color: uniWindowColor, emissive: 0x112233, transparent: true, opacity: 0.85 })
            );
            makeInteractive(glass, 'https://www.notion.so/Registry-of-Physis-Pistidos-University-1f2936a26e6380ab9f6bc314fb3c011d', '🪟 University Window');
            windowGroup.add(glass);

            const barMat = new THREE.MeshStandardMaterial({ color: uniWindowFrameColor });
            const hBar = new THREE.Mesh(new THREE.BoxGeometry(w + 0.06, 0.05, d + 0.02), barMat);
            hBar.position.z = 0.01;
            makeInteractive(hBar, 'https://www.notion.so/Registry-of-Physis-Pistidos-University-1f2936a26e6380ab9f6bc314fb3c011d', '🪟 University Window');
            windowGroup.add(hBar);

            const vBar = new THREE.Mesh(new THREE.BoxGeometry(0.05, h + 0.06, d + 0.02), barMat);
            vBar.position.z = 0.01;
            makeInteractive(vBar, 'https://www.notion.so/Registry-of-Physis-Pistidos-University-1f2936a26e6380ab9f6bc314fb3c011d', '🪟 University Window');
            windowGroup.add(vBar);

            windowGroup.position.set(posX, posY, posZ);
            windowGroup.rotation.y = rotationY;
            return windowGroup;
        }

        uniGroup.add(createUniWindow(-1.6, 2.8, uniWallDepth / 2 + 0.02, 0));
        uniGroup.add(createUniWindow(-0.55, 2.8, uniWallDepth / 2 + 0.02, 0));
        uniGroup.add(createUniWindow(0.55, 2.8, uniWallDepth / 2 + 0.02, 0));
        uniGroup.add(createUniWindow(1.6, 2.8, uniWallDepth / 2 + 0.02, 0));
        uniGroup.add(createUniWindow(uniWallWidth / 2 + 0.02, 2.8, -0.8, Math.PI / 2));
        uniGroup.add(createUniWindow(uniWallWidth / 2 + 0.02, 2.8, 0.8, Math.PI / 2));
        uniGroup.add(createUniWindow(-uniWallWidth / 2 - 0.02, 2.8, -0.8, -Math.PI / 2));
        uniGroup.add(createUniWindow(-uniWallWidth / 2 - 0.02, 2.8, 0.8, -Math.PI / 2));

        const cupola = makeInteractive(
            new THREE.Mesh(
                new THREE.CylinderGeometry(0.5, 0.6, 1.0, 8),
                new THREE.MeshStandardMaterial({ color: uniColumnColor, roughness: 0.6 })
            ),
            'https://en.wikipedia.org/wiki/Cupola',
            '🏛️ Cupola'
        );
        cupola.position.set(0, uniWallHeight + 1.3, 0);
        uniGroup.add(cupola);

        const cupolaRoof = makeInteractive(
            new THREE.Mesh(
                new THREE.ConeGeometry(0.65, 0.6, 8),
                new THREE.MeshStandardMaterial({ color: uniRoofColor, roughness: 0.6 })
            ),
            'https://en.wikipedia.org/wiki/Cupola',
            '🏛️ Cupola Roof'
        );
        cupolaRoof.position.set(0, uniWallHeight + 2.1, 0);
        uniGroup.add(cupolaRoof);

        // ============================================================
        //  OUTHOUSE  (behind the house) — NO OUTER WALLS
        // ============================================================
        const outhouseGroup = new THREE.Group();
        outhouseGroup.position.set(-4.5, 0, -6.5);
        outhouseGroup.rotation.y = Math.PI * 0.05;
        scene.add(outhouseGroup);

        const outRoofColor = 0x6b4a3a;
        const outDoorColor = 0x7a5a3a;
        const outPostColor = 0xa89070;

        const outW = 3.0;
        const outH = 2.0;
        const outD = 3.0;
        const postThickness = 0.1;

        // Floor plate
        const outFloor = makeInteractive(
            new THREE.Mesh(
                new THREE.BoxGeometry(outW, 0.05, outD),
                new THREE.MeshStandardMaterial({ color: 0x9e8a70, roughness: 0.9 })
            ),
            'https://en.wikipedia.org/wiki/Outhouse',
            '🚽 Outhouse Floor'
        );
        outFloor.position.y = 0.025;
        outhouseGroup.add(outFloor);

        // Four corner posts
        const postGeo = new THREE.BoxGeometry(postThickness, outH, postThickness);
        const postMat = new THREE.MeshStandardMaterial({ color: outPostColor, roughness: 0.85 });
        const cornerPositions = [
            [-outW / 2, outH / 2, -outD / 2],
            [ outW / 2, outH / 2, -outD / 2],
            [-outW / 2, outH / 2,  outD / 2],
            [ outW / 2, outH / 2,  outD / 2]
        ];
        cornerPositions.forEach(([px, py, pz]) => {
            const post = makeInteractive(
                new THREE.Mesh(postGeo, postMat),
                'https://en.wikipedia.org/wiki/Outhouse',
                '🚽 Outhouse Post'
            );
            post.position.set(px, py, pz);
            outhouseGroup.add(post);
        });

        // Doorway frame
        const outDoorWidth = 1.0;
        const outDoorHeight = 1.7;

        const frameLeft = makeInteractive(
            new THREE.Mesh(
                new THREE.BoxGeometry(0.08, outDoorHeight, 0.1),
                new THREE.MeshStandardMaterial({ color: outPostColor, roughness: 0.85 })
            ),
            'https://en.wikipedia.org/wiki/Outhouse',
            '🚽 Door Frame (Left)'
        );
        frameLeft.position.set(-outDoorWidth / 2, outDoorHeight / 2, outD / 2);
        outhouseGroup.add(frameLeft);

        const frameRight = makeInteractive(
            new THREE.Mesh(
                new THREE.BoxGeometry(0.08, outDoorHeight, 0.1),
                new THREE.MeshStandardMaterial({ color: outPostColor, roughness: 0.85 })
            ),
            'https://en.wikipedia.org/wiki/Outhouse',
            '🚽 Door Frame (Right)'
        );
        frameRight.position.set(outDoorWidth / 2, outDoorHeight / 2, outD / 2);
        outhouseGroup.add(frameRight);

        const frameLintel = makeInteractive(
            new THREE.Mesh(
                new THREE.BoxGeometry(outDoorWidth + 0.16, 0.1, 0.1),
                new THREE.MeshStandardMaterial({ color: outPostColor, roughness: 0.85 })
            ),
            'https://en.wikipedia.org/wiki/Outhouse',
            '🚽 Door Lintel'
        );
        frameLintel.position.set(0, outDoorHeight + 0.05, outD / 2);
        outhouseGroup.add(frameLintel);

        // Outhouse door
        const outDoor = makeInteractive(
            new THREE.Mesh(
                new THREE.BoxGeometry(outDoorWidth, outDoorHeight, 0.08),
                new THREE.MeshStandardMaterial({ color: outDoorColor, roughness: 0.85 })
            ),
            'work/index.html',
            '🚪 Outhouse Door'
        );
        outDoor.position.set(0, outDoorHeight / 2, outD / 2 + 0.06);
        outhouseGroup.add(outDoor);

        // Outhouse roof
        const outRoof = makeInteractive(
            new THREE.Mesh(
                new THREE.ConeGeometry(Math.sqrt(2) * (outW / 2) * 1.05, 0.9, 4),
                new THREE.MeshStandardMaterial({ color: outRoofColor, roughness: 0.7, flatShading: true })
            ),
            'https://en.wikipedia.org/wiki/Roof',
            '🏘️ Outhouse Roof'
        );
        outRoof.position.y = outH + 0.45;
        outRoof.rotation.y = Math.PI / 4;
        outhouseGroup.add(outRoof);

        // ============================================================
        //  TABLES INSIDE THE OUTHOUSE
        // ============================================================

        // --- TABLE 1: WITH TWO SCROLLS (clickable) ---
        const tableGroup1 = new THREE.Group();
        tableGroup1.position.set(-0.7, 0, 0.4);
        outhouseGroup.add(tableGroup1);

        const tableTopColor = 0x8b6b4a;
        const tableLegColor = 0x5a3f2a;

        const table1Top = makeInteractive(
            new THREE.Mesh(
                new THREE.BoxGeometry(1.0, 0.08, 0.7),
                new THREE.MeshStandardMaterial({ color: tableTopColor, roughness: 0.75 })
            ),
            'https://en.wikipedia.org/wiki/Table_(furniture)',
            '🪑 Table (with scrolls)'
        );
        table1Top.position.y = 0.7;
        tableGroup1.add(table1Top);

        const legGeo = new THREE.BoxGeometry(0.08, 0.7, 0.08);
        const legMat = new THREE.MeshStandardMaterial({ color: tableLegColor, roughness: 0.85 });
        const legOffsets = [
            [-0.42, 0.35, -0.27],
            [ 0.42, 0.35, -0.27],
            [-0.42, 0.35,  0.27],
            [ 0.42, 0.35,  0.27]
        ];
        legOffsets.forEach(([lx, ly, lz]) => {
            const leg = new THREE.Mesh(legGeo, legMat);
            leg.position.set(lx, ly, lz);
            tableGroup1.add(leg);
        });

        // --- TWO INDIVIDUALLY CLICKABLE SCROLLS ---
        // Each scroll is a single mesh (a horizontally-oriented cylinder),
        // so clicking it unambiguously hits that scroll. One is black,
        // one is white, and each opens its own URL.

        // BLACK SCROLL — left position on the table
        const blackScroll = makeInteractive(
            new THREE.Mesh(
                new THREE.CylinderGeometry(0.07, 0.07, 0.5, 12),
                new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.6 })
            ),
            'old_mandarin/index.html',
            '📜 Earth Scroll'
        );
        // Rotate to lie horizontally along X
        blackScroll.rotation.z = Math.PI / 2;
        blackScroll.rotation.y = 0.2; // small turn for natural look
        blackScroll.position.set(-0.22, 0.78, 0.0);
        tableGroup1.add(blackScroll);

        // WHITE SCROLL — right position on the table
        const whiteScroll = makeInteractive(
            new THREE.Mesh(
                new THREE.CylinderGeometry(0.07, 0.07, 0.5, 12),
                new THREE.MeshStandardMaterial({ color: 0xf5f0e6, roughness: 0.7 })
            ),
            'mandarin/index.html',
            '📜 Heaven Scroll'
        );
        whiteScroll.rotation.z = Math.PI / 2;
        whiteScroll.rotation.y = -0.15;
        whiteScroll.position.set(0.22, 0.78, 0.0);
        tableGroup1.add(whiteScroll);

        // --- TABLE 2: EMPTY (clickable) ---
        const tableGroup2 = new THREE.Group();
        tableGroup2.position.set(0.7, 0, -0.5);
        outhouseGroup.add(tableGroup2);

        const table2Top = makeInteractive(
            new THREE.Mesh(
                new THREE.BoxGeometry(1.0, 0.08, 0.7),
                new THREE.MeshStandardMaterial({ color: 0x7a5f45, roughness: 0.8 })
            ),
            'https://en.wikipedia.org/wiki/Table_(furniture)',
            '🪑 Empty Table'
        );
        table2Top.position.y = 0.7;
        tableGroup2.add(table2Top);

        legOffsets.forEach(([lx, ly, lz]) => {
            const leg = new THREE.Mesh(legGeo, legMat);
            leg.position.set(lx, ly, lz);
            tableGroup2.add(leg);
        });

        // ============================================================
        //  GROUND
        // ============================================================
        const ground = new THREE.Mesh(
            new THREE.CircleGeometry(40, 64),
            new THREE.MeshStandardMaterial({ color: 0x6b8e4c, roughness: 0.95, side: THREE.DoubleSide })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.01;
        scene.add(ground);

        // Plaza between house & university
        const plaza = new THREE.Mesh(
            new THREE.CircleGeometry(3, 32),
            new THREE.MeshStandardMaterial({ color: 0xc8bca8, roughness: 0.9 })
        );
        plaza.rotation.x = -Math.PI / 2;
        plaza.position.set(0.5, 0, 2);
        scene.add(plaza);

        // Small path from house to outhouse
        const path = new THREE.Mesh(
            new THREE.PlaneGeometry(1.0, 2.5),
            new THREE.MeshStandardMaterial({ color: 0xb0a890, roughness: 0.9 })
        );
        path.rotation.x = -Math.PI / 2;
        path.position.set(-4.5, 0.005, -4.0);
        scene.add(path);

        // ============================================================
        //  RAYCASTING FOR CLICKS & HOVER
        // ============================================================
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        const tooltip = document.getElementById('tooltip');

        function updatePointer(event) {
            pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
        }

        function findIntersectedObject() {
            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObjects(interactiveObjects, false);
            return intersects.length > 0 ? intersects[0].object : null;
        }

        renderer.domElement.addEventListener('pointermove', (event) => {
            updatePointer(event);

            if (event.buttons !== 0) {
                tooltip.classList.remove('visible');
                renderer.domElement.style.cursor = 'default';
                return;
            }

            const obj = findIntersectedObject();
            if (obj) {
                renderer.domElement.style.cursor = 'pointer';
                tooltip.textContent = obj.userData.label;
                tooltip.style.left = event.clientX + 'px';
                tooltip.style.top = event.clientY + 'px';
                tooltip.classList.add('visible');
            } else {
                renderer.domElement.style.cursor = 'default';
                tooltip.classList.remove('visible');
            }
        });

        let pointerDownPos = { x: 0, y: 0 };
        let pointerDownTime = 0;

        renderer.domElement.addEventListener('pointerdown', (event) => {
            pointerDownPos.x = event.clientX;
            pointerDownPos.y = event.clientY;
            pointerDownTime = Date.now();
        });

        renderer.domElement.addEventListener('pointerup', (event) => {
            const dx = event.clientX - pointerDownPos.x;
            const dy = event.clientY - pointerDownPos.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const elapsed = Date.now() - pointerDownTime;

            if (dist > 5 || elapsed > 500) return;

            updatePointer(event);
            const obj = findIntersectedObject();

            if (obj && obj.userData.url) {
                window.open(obj.userData.url, '_blank', 'noopener,noreferrer');
            }
        });

        renderer.domElement.addEventListener('pointerleave', () => {
            tooltip.classList.remove('visible');
            renderer.domElement.style.cursor = 'default';
        });

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
